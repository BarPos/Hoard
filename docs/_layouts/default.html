<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <a class="logo" href="{{ '/' | relative_url }}"><span class="diamond">◆</span> <span class="grad">HOARD</span></a>
    <nav>
      {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="on"{% endif %}>{{ item.title }}</a>{% endfor %}
      <a href="https://github.com/BarPos/Hoard">GitHub</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Hoard {{ site.data.version | default: "1.0.0" }} · <a href="https://github.com/BarPos/Hoard">source on GitHub</a> · screenshots are rendered from the real app with a made-up home folder
  </footer>
</body>
</html>
