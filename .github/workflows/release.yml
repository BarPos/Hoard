# Manual release: Actions → Release → Run workflow. Nothing runs automatically.
#
# Reads the version from the VERSION file, tests, builds the macOS (Apple Silicon) binary,
# and publishes a GitHub release tagged v<VERSION> with the archive, its SHA-256 and install.sh.
# To release a new version: bump VERSION, push to main, run this workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: false
      draft:
        description: Create as a draft (publish it by hand later)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::VERSION must look like 1.2.3 or 1.2.3-beta.1 (got '$VERSION')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error file=VERSION::v$VERSION is already released. Bump the VERSION file and push before releasing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing Hoard $VERSION from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

      - name: Build and package
        run: build/package.sh

      - name: Check the installer
        run: bash -n install.sh && /bin/bash -n install.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          [[ "$DRAFT" == "true" ]] && flags+=(--draft)
          [[ "$PRERELEASE" != "true" && "$DRAFT" != "true" ]] && flags+=(--latest)
          cat > notes.md <<NOTES
          ## Install or update

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | bash
          \`\`\`

          The installer (\`install.sh\`, attached below) can also update, install a specific version or uninstall.

          macOS on Apple Silicon only. Manual install: download \`hoard-${VERSION}-macos-arm64.tar.gz\`,
          check it with \`shasum -a 256 -c hoard-${VERSION}-macos-arm64.tar.gz.sha256\`, and put \`hoard\` on your PATH.
          NOTES
          gh release create "v$VERSION" \
            dist/hoard-"$VERSION"-macos-arm64.tar.gz \
            dist/hoard-"$VERSION"-macos-arm64.tar.gz.sha256 \
            install.sh \
            --target "$GITHUB_SHA" \
            --title "Hoard $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
